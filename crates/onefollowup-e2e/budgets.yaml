# The destination store operations one follow-up batch makes, counted at onefollowup's store
# boundary while this project's `e2e` target runs by two journeys: tests/e2e/budget.rs's
# realistic batch and tests/e2e/crowded_filing.rs's crowded-destination filing batch. The
# budget's command is tests/e2e/budget_runner.rs, which reports the larger of the two figures
# that run recorded; its last argument names the saved telemetry it reads, a libtest filter no
# test matches.
#
# Basis, by arithmetic over the batched design. The realistic batch: prepare's one task find and
# one comments read, and publish's create-only copy of the new tickets, held copy of the bound
# ones, one comment add-many and one update-many make 6 operations, settle reading nothing back
# since every write's answer names its version. The crowded batch: prepare's one task find
# carrying every draft's title, term and file searches (about 80) and one comments read, then
# publish's create-only copy of the 2 new tickets, one comment add-many relating the 10
# duplicates and one update-many re-estimating them make 5; one call per search would make
# about 84. The headroom above 6 is one further `ticket search` and a settle read-back of writes
# whose answers were lost.
schema_version: 1
budgets:
  - id: follow-up-batch-store-operations
    description: >-
      Store operations one follow-up batch makes against its destination from `prepare` to
      `settle` — each onetaskgraph read, query, copy, comment or write call, counted at
      onefollowup's store boundary, the local drafts source excluded — the larger of a realistic
      batch (400 other items; 12 new tickets, 4 bound ones re-copied, 4 evidence comments each
      re-estimated) and a crowded-destination filing batch (2,000 tickets across 6 repositories,
      about 470 open; 12 drafts, 10 of them duplicates, each searching about 5 terms and its
      failing file), with each journey's phases, the items each read or wrote and the searches
      prepare's find carried in the detail. It protects a destination's shared allowance by
      holding a whole batch's destination work, duplicate searches included, to a handful of
      batched store calls; each call's own cost is held by onetaskgraph's budgets.
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onefollowup-e2e", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture", "../../target/debug/telemetry/onefollowup-e2e"]
    unit: operations
    direction: max
    threshold: 8
  # The comment pass, counted by tests/e2e/comment_budgets.rs. Basis, by arithmetic over the
  # batched design: one gathering listing, one batched settle read verifying the 40 replies, and
  # one `update-many` carrying the 10 changed tickets' writes, re-estimates included — 3, against
  # 22 in the loop this replaces (one gathering copy, one settle read and two held writes for each
  # of 10 tickets). No headroom: no step of the pass may add a destination call. The reporter runs
  # after this crate's `test` target built its test binary, so cargo only checks freshness and
  # one test reads one telemetry file: about 60 seconds on a loaded shared host.
  # llmlint: ignore[budgets_track_product_owner_outcomes] The user set separate targets for store operations per comment pass and per ticket's life, and each is held at its own workload: a 40-comment pass over 6 batches grows with comments gathered, while one ticket's life does not. Folding one into the other's breakdown would drop a target the user ruled.
  - id: comment-pass-store-operations
    description: >-
      Store operations one comment-answering pass makes: the plan-store operations onefollowup
      itself makes in one realistic pass from `comments gather` to `comments settle`, counted at
      its store boundary — 40 comments on 20 proposals owned by 6 batches, beside 60 other items
      of this host, gathered once, answered by one feedback dispatch per owning batch, 10 tickets
      changed by the answers, settled once. The detail gives the gather, the settle's read and its
      writes apart, with the items each touched. An inner measure: it leaves out the reply writes
      the dispatched answering agents make, one per comment answered, fixed by the comments people
      wrote rather than by anything onefollowup's code can change, while its own reads,
      verifications and settles are the part its code moves and a regression would grow. It
      protects a destination's shared allowance at realistic comment volume; each operation's
      cost to GitHub or Linear is held by onetaskgraph's own budgets.
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onefollowup-e2e", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture", "../../target/debug/telemetry/onefollowup-e2e"]
    unit: operations
    direction: max
    threshold: 3
  # One ticket's whole life, counted by tests/e2e/comment_budgets.rs. Basis, by arithmetic over
  # the batched design: filing makes one batched search and one copy, its answer verifying it;
  # the re-copy one copy held to the receipted version with no read first; the answer one
  # gathering listing, one settle read verifying the reply and one held update carrying the
  # ticket change and the withdrawal — 6, against 9 in the loop this replaces. 6 was approved
  # over a target of about 5, keeping both safeguards: reaching 5 would drop the search before
  # filing or the reply's verification. About 60 seconds to report, as above.
  # llmlint: ignore[budgets_track_product_owner_outcomes] The user set separate targets for store operations per comment pass and per ticket's life, and each is held at its own workload: a 40-comment pass over 6 batches grows with comments gathered, while one ticket's life does not. Folding one into the other's breakdown would drop a target the user ruled.
  - id: ticket-lifecycle-store-operations
    description: >-
      Store operations one ticket's whole life makes: the destination store operations one
      follow-up ticket makes from being filed by one batch, through being re-copied by a
      re-dispatch of that batch, to being answered once by a comment pass whose answer withdraws
      it, on a destination holding 60 other items, counted at onefollowup's store boundary. The
      detail gives each step's operations. An inner measure: it leaves out the reply write the
      dispatched answering agent makes, fixed by the comment a person wrote rather than by
      onefollowup's code, and calls to the local drafts source, which spend no destination's
      shared allowance. It protects that shared allowance over a ticket's life.
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onefollowup-e2e", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture", "../../target/debug/telemetry/onefollowup-e2e"]
    unit: operations
    direction: max
    threshold: 6
  # One empty batch's snapshot, counted by tests/e2e/snapshot.rs. Basis, by arithmetic over
  # `snapshot`'s contract: on a batch with no drafts and no hook inputs it makes one drafts
  # search covering the batch and its aliases together, no destination read and no write — 1.
  # No headroom: any further call is a regression. It counts the `snapshot` call alone because
  # once a host skips an empty batch that call is all the store work the batch causes; that the
  # host launches nothing else is the host's journeys' to assert. About 60 seconds to report,
  # as above.
  - id: empty-batch-store-operations
    description: >-
      Store operations one `onefollowup snapshot` of a batch holding nothing to verify makes,
      counted at onefollowup's store boundary against the drafts source and the destination
      alike — a fresh batch with 2 aliases and no drafts, a `batch_preparing` hook printing no
      inputs, beside 120 drafts of 30 other batches and a destination holding 400 other items.
      The detail gives the drafts-source and destination operations apart, with the searches
      each carried. It protects the store allowance every finished run with nothing to verify
      spends, at about 305 such runs a month.
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onefollowup-e2e", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture", "../../target/debug/telemetry/onefollowup-e2e"]
    unit: operations
    direction: max
    threshold: 1
  # One full grooming pass, counted by tests/e2e/groom_budget.rs. Basis, by arithmetic over the
  # batched design: prepare's open-item listing, one comments-since read and one batched read of
  # the selected tickets' comments (3); publish's batched status read of the tickets to close or
  # fold, one update-many carrying every close, duplicate close and groom record, one comment
  # add-many built from its receipts, and one batched read-back of every ticket changed (4). No
  # headroom: the status read took the operation once held for re-reading lost write answers.
  # The 2026-11-20 manual pass made 219 store calls for the same work. About 60 seconds to
  # report, as above.
  - id: groom-pass-store-operations
    description: >-
      Store operations one full grooming pass makes against its destination, from `groom
      prepare` to the end of `groom publish` — each onetaskgraph read, list, comment or write
      call, counted at onefollowup's store boundary, the governor's quota reads excluded — over
      600 open and 1,400 closed tickets across 6 repositories, 2 comments each, in 12 shards of
      50: 520 kept, 50 fixed, 6 obsolete, 4 unresolved and 20 duplicates in 12 clusters. The
      detail gives each phase's operations and the tickets each read or wrote. It protects the
      shared GitHub points and the wait a pass spends on the real board.
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onefollowup-e2e", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture", "../../target/debug/telemetry/onefollowup-e2e"]
    unit: operations
    direction: max
    threshold: 7
  # A grooming pass with nothing changed, counted by tests/e2e/groom_budget.rs straight after the
  # full pass. Basis, by arithmetic: the second prepare's open-item listing reads every ticket's
  # groom key and its one comments-since read finds no comment later than its ticket's record but
  # grooming's own, so it selects none and writes no batch (2); the first batch's publish run
  # again finds every write receipted, sends nothing and repeats only its batched read-back (1).
  # About 60 seconds to report, as above.
  # llmlint: ignore[budgets_track_product_owner_outcomes] The task sets separate targets for a full grooming pass and a pass with nothing changed: the repeat pass is not a step of the full one but the regular pass's whole cost, which incremental selection and the receipts exist to keep a fraction of a full pass's.
  - id: groom-repeat-pass-store-operations
    description: >-
      Store operations a grooming pass makes against its destination when it runs straight
      after a published full pass with no ticket, comment or repository changed, and the first
      pass's publish is run again — counted at onefollowup's store boundary, the governor's
      quota reads excluded — over the full pass's destination. The detail gives each step's
      operations. It protects the shared points a regular pass, or a retry, spends on the real
      board.
    measure: reported
    command: ["cargo", "test", "--quiet", "-p", "onefollowup-e2e", "--locked", "--test", "e2e", "--", "budget_runner::report", "--exact", "--nocapture", "../../target/debug/telemetry/onefollowup-e2e"]
    unit: operations
    direction: max
    threshold: 3
