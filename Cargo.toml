[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# onetaskgraph's crates require 1.97; nothing here needs newer.
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/nickderobertis/onefollowup"
authors = ["Nick DeRobertis"]

[workspace.dependencies]
# Every store access: the engine and, through its features, every destination plugin
# (local-md built in, GitHub Projects and Linear switched on). onetaskgraph's pre-1.0
# crates release in lock step and are not compatible across patches, so the pin is exact.
onetaskgraph-core = { version = "=0.14.12", features = ["github-projects", "linear"] }
# The contract crate, for the status vocabulary a status role maps to.
onetaskgraph-plugin-api = "=0.14.12"
clap = { version = "4.6.6", features = ["derive"] }
# Timestamps a draft, a ticket and a receipt record.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
gethostname = "1.1.0"
indexmap = { version = "2.12.1", features = ["serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`: every record keeps the key order it was written in, which is what lets
# a record round-trip byte for byte.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Every YAML read: safe Rust (deny.toml bans the libyaml translations).
serde-saphyr = "1.3"
serde_path_to_error = "0.1.20"
# A ticket's copy digest.
sha2 = "0.10.9"
# The verifying agent's task and a kind's ticket template are Jinja templates.
minijinja = { version = "2.24.0", features = ["loader"] }
# onetaskgraph's engine is async; each verb drives it on one current-thread runtime.
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
thiserror = "2.0.20"

assert_cmd = "2.2.2"
# The budget runner hands each figure the journeys recorded to `onebudgetspec check`.
onebudgetspec-core = "0.2.0"
# Tests read onetaskgraph's status vocabulary off its own JSON schema.
schemars = "1.2.2"
tempfile = "3.24.0"

[profile.release]
strip = true

[profile.dev.package."*"]
opt-level = 1
