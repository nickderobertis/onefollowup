destination: followups
drafts_source: drafts
hooks:
  batch_preparing: [scripts/follow-up-budget-inputs.sh]
  batch_settled: [onepipeline, human-items, raise, --phase, follow-up-review, --context, '{context_file}']
  # The engine's review item names its owner: the session the host's schedule runs settle in.
  owner:
    session: ${FOLLOW_UP_SESSION}
