        if: always() && steps.nx-cache-trust.outputs.promotable == 'true'
        with:
          name: nx-cache-entries-${{ github.job }}
          path: ${{ runner.temp }}/nx-cache-report
          retention-days: 7
      - cancel: nx-cache

  # The tests, coverage, budgets and e2e journeys of the affected projects on macOS.
  test-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned tool versions
        id: pins
        shell: bash
        run: |
          tr -d '\r' < .github/ci-tool-versions | awk '
            /^#/ || !NF { next }
