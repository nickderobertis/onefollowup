sources:
  drafts:
    plugin: local-md
    config: {root: .follow-ups}
  followups:
    visibility: public
    plugin: github-projects
    config:
      owner: example-owner
      project_number: 3
      repository: example-owner/example-repo
      token_env: GH_PROJECTS_TOKEN
      status_mapping: {backlog: Proposal, draft: Deferred, queued: Queued, done: Done, cancelled: Cancelled}
      priority_mapping: {urgent: Urgent, high: High, medium: Medium, low: Low}
      # Board fields read from the ticket record: two of its own keys, and two values
      # onefollowup renders from the kind's `projections` into `projected`.
      metadata_fields:
        - field: Host
          key: orchestrator.follow-up
          path: [host]
        - field: Witnesses
          key: orchestrator.follow-up
          path: [witnesses]
        - field: Root cause
          key: orchestrator.follow-up
          path: [projected, root_cause]
        - field: Who is affected
          key: orchestrator.follow-up
          path: [projected, who_is_affected]
